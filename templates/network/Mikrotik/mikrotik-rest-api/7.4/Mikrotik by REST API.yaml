          key: zabbix.api.item.get
          delay: 10s
          value_type: TEXT
          status: DISABLED
          url: 'http://localhost:8080/api_jsonrpc.php'
          post_type: JSON
          posts: |
            {
                "jsonrpc": "2.0",
                "method": "item.get",
                "params": {
                    "output": "extend",
                    "hostids": "10780",
                    "with_triggers": true,
                    "search": {
                        "key_": "routing.bgp.session.["
                    },
                    "sortfield": "name"
                },
                "id": 1
