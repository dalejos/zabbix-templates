    - uuid: 1cbd4601cd08453eab3e80bc3ffd69b4
      template: 'Mikrotik by REST API - OSPF'
      name: 'Mikrotik by REST API - OSPF'
      groups:
        - name: 'Templates/Network devices'
      items:
        - uuid: 50a6ec52dfb94b0a8a5f66c14ca06f92
          name: 'Mikrotik: REST API routing OSPFv2 instances'
          type: HTTP_AGENT
          key: routing.ospf.instance.v2
          delay: 5m
          value_type: TEXT
          authtype: BASIC
          username: '{$REST_API_USER}'
          password: '{$REST_API_PASSWORD}'
          url: '{$REST_API_PROTOCOL}://{$REST_API_HOST}:{$REST_API_PORT}/rest/routing/ospf/instance/print'
          post_type: JSON
