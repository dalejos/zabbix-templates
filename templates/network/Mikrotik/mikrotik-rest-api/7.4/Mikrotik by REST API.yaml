          password: '{$REST_API_PASSWORD}'
          url: '{$REST_API_PROTOCOL}://{$REST_API_HOST}:{$REST_API_PORT}/rest/routing/ospf/instance/print'
          post_type: JSON
          posts: |
            {
                ".query":["version=2"],
                ".proplist" : ".id,name,router-id,version,vrf,redistribute,originate-default"
            }
          request_method: POST
          tags:
            - tag: component
              value: json
            - tag: component
              value: ospf
        - uuid: a10d9cf434f04bacb726c0ce66f613eb
          name: 'Mikrotik: REST API routing OSPFv2 neighbors'
          type: HTTP_AGENT
          key: routing.ospf.neighbor
          delay: 30s
          value_type: TEXT
          authtype: BASIC
          username: '{$REST_API_USER}'
          password: '{$REST_API_PASSWORD}'
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - |
                  var data = JSON.parse(value);
                  var instanceFilter = '{$OSPFV2_INSTANCE.MATCHES}';
                  var instanceRegex;
                  
                  try {
                      instanceRegex = new RegExp(instanceFilter);
                  } catch (error) {
                      instanceRegex = /.*/;
                  }
                  
                  data = data.filter(function (item) {
                      return !item.instance || instanceRegex.test(item.instance);
                  });
                  
                  data.forEach(function (item) {
                      if (!('state' in item)) {
                          item.state = 'down';
                      }
                  
                      item.state = String(item.state).toLowerCase();
                  
                      item.discovery_key = String(item['.id'] || item['router-id'] || item.address || '')
                          .replace(/[^A-Za-z0-9_.-]/g, '_');
                  });
                  
                  return JSON.stringify(data);
          url: '{$REST_API_PROTOCOL}://{$REST_API_HOST}:{$REST_API_PORT}/rest/routing/ospf/neighbor/print'
          post_type: JSON
          posts: |
            {
                ".proplist" : ".id,address,router-id,state,state-changes,adjacency,area,instance,priority,dr,bdr,db-summaries,ls-requests,ls-retransmits"
            }
          request_method: POST
          tags:
            - tag: component
              value: json
            - tag: component
              value: ospf
        - uuid: 59145d99ca52404fa44ea0aabb53e396
          name: 'Mikrotik: Routing OSPFv2 neighbor count'
          type: DEPENDENT
          key: routing.ospf.neighbor.count
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - |
                  return JSON.parse(value).length;
          master_item:
            key: routing.ospf.neighbor
          tags:
            - tag: component
              value: ospf
        - uuid: 2d48e31722284e4d8c0193855f0bdf9e
          name: 'Mikrotik: Routing OSPFv2 neighbors not full'
          type: DEPENDENT
          key: routing.ospf.neighbor.not-full.count
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - |
                  var data = JSON.parse(value);
                  
                  return data.filter(function (item) {
                      return item.state !== 'full';
                  }).length;
          master_item:
            key: routing.ospf.neighbor
          tags:
            - tag: component
              value: ospf
          triggers:
            - uuid: 3cd7ab7084ca41ec977931ee207a06e8
              expression: 'last(/Mikrotik by REST API/routing.ospf.neighbor.not-full.count)>0'
              name: 'OSPFv2 has neighbors that are not full'
              priority: HIGH
              manual_close: 'YES'
        - uuid: ee2b3c07016e4b228078556672670035
          name: 'Mikrotik: REST API routing OSPFv2 LSA summary'
          type: HTTP_AGENT
          key: routing.ospf.lsa.summary
          delay: 5m
          value_type: TEXT
          authtype: BASIC
          username: '{$REST_API_USER}'
          password: '{$REST_API_PASSWORD}'
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - |
                  var data = JSON.parse(value);
                  var instanceFilter = '{$OSPFV2_INSTANCE.MATCHES}';
                  var instanceRegex;
                  var result = {};
                  
                  try {
                      instanceRegex = new RegExp(instanceFilter);
                  } catch (error) {
                      instanceRegex = /.*/;
                  }
                  
                  data.forEach(function (item) {
                      if (item.instance && !instanceRegex.test(item.instance)) {
                          return;
                      }
                  
                      var key = [item.instance || '', item.area || '', item.type || 'unknown'].join('|');
                      
                      if (!result[key]) {
                          result[key] = {
                              discovery_key: key.replace(/[^A-Za-z0-9_.-]/g, '_'),
                              instance: item.instance || '',
                              area: item.area || '',
                              type: item.type || 'unknown',
                              count: 0,
                              self_originated_count: 0,
                              max_age: 0
                          };
                      }
                  
                      result[key].count++;
                  
                      if (item['self-originated'] === 'yes' || item['self-originated'] === true) {
                          result[key].self_originated_count++;
                      }
                  
                      var age = Number(item.age || 0);
                      if (age > result[key].max_age) {
                          result[key].max_age = age;
                      }
                  });
                  
                  return JSON.stringify(Object.keys(result).map(function (key) {
                      return result[key];
                  }));
          url: '{$REST_API_PROTOCOL}://{$REST_API_HOST}:{$REST_API_PORT}/rest/routing/ospf/lsa/print'
          post_type: JSON
          posts: |
            {
                ".proplist" : ".id,age,area,instance,self-originated,type"
            }
          request_method: POST
          tags:
            - tag: component
              value: json
            - tag: component
              value: ospf
        - uuid: 599273ac13fd477282e788536033c96e
          name: 'Mikrotik: Routing OSPFv2 LSA count'
          type: DEPENDENT
          key: routing.ospf.lsa.count
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - |
                  var data = JSON.parse(value);
                  
                  return data.reduce(function (sum, item) {
                      return sum + Number(item.count || 0);
                  }, 0);
          master_item:
            key: routing.ospf.lsa.summary
          tags:
            - tag: component
              value: ospf
