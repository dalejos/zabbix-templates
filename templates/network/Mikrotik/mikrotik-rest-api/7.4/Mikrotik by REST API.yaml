        - uuid: 755fa2ad93434170a3bda5d7404d5f22
          name: 'Mikrotik: System routerboard type.'
          type: DEPENDENT
          key: system.routerboard.type
          value_type: TEXT
          inventory_link: TYPE
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - |
                  var result;
                  
                  switch (true) {
                      case /^CCR/.test(value):
                          result = "Cloud Core Router";
                          break;
                      case /^CRS/.test(value):
                          result = "Cloud Router Switch";
                          break;
                      case /^RB/.test(value):
                          result = "Routerboard";
                          break;
                      case /hAP/.test(value):
                          result = "Home Router AP";
                          break;
                      default:
                          result = "undefined";
                  }
                  
                  return result;
          master_item:
            key: system.routerboard.hardware
