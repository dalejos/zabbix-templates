zabbix_export:
  version: '7.4'
  template_groups:
    - uuid: 36bff6c29af64692839d077febfc7079
      name: 'Templates/Network devices'
  templates:
    - uuid: 4d95fa18d3d548e4afa2aeccedd8689a
      template: 'Mikrotik by REST API'
      name: 'Mikrotik by REST API'
      groups:
        - name: 'Templates/Network devices'
      items:
        - uuid: e92a908dadee4ef3a3e184369dc4daa0
          name: 'ICMP loss'
          type: SIMPLE
          key: 'icmppingloss[{$REST_API_HOST},10]'
          value_type: FLOAT
          units: '%'
          description: 'The percentage of lost packets.'
          tags:
            - tag: component
              value: health
            - tag: component
              value: network
        - uuid: 870c606bec194d1ab86f20cecc1f8927
          name: 'ICMP response time'
          type: SIMPLE
          key: 'icmppingsec[{$REST_API_HOST}]'
          value_type: FLOAT
          description: 'The ICMP ping response time (in seconds).'
          tags:
            - tag: component
              value: health
            - tag: component
              value: network
        - uuid: 049c652484684a899666e8a8fcb12fb4
          name: 'ICMP ping'
          type: SIMPLE
          key: 'icmpping[{$REST_API_HOST}]'
          description: |
            The host accessibility by ICMP ping.
            
            0 - ICMP ping fails;
            1 - ICMP ping successful.
          valuemap:
            name: 'Service state'
          tags:
            - tag: component
              value: health
            - tag: component
              value: network
        - uuid: 7bf47fbba08b46abbc578e3bb45e92ab
          name: 'Mikrotik: REST API interface'
          type: HTTP_AGENT
          key: interface
          delay: 10s
          value_type: TEXT
          authtype: BASIC
          username: '{$REST_API_USER}'
          password: '{$REST_API_PASSWORD}'
          url: '{$REST_API_PROTOCOL}://{$REST_API_HOST}:{$REST_API_PORT}/rest/interface/print'
          post_type: JSON
          posts: |
            {
                ".proplist" : ".id,name,running,tx-byte,rx-byte,type"
            }
          request_method: POST
          tags:
            - tag: component
              value: interface
            - tag: component
              value: json
        - uuid: 22bdc9205edc407e92a9dd11f68e13c3
          name: 'Mikrotik: REST API interface ethernet'
          type: HTTP_AGENT
          key: interface.ethernet
          value_type: TEXT
          authtype: BASIC
          username: '{$REST_API_USER}'
          password: '{$REST_API_PASSWORD}'
          url: '{$REST_API_PROTOCOL}://{$REST_API_HOST}:{$REST_API_PORT}/rest/interface/ethernet/print'
          post_type: JSON
          posts: |
            {
                ".query":["running=true"]
            }
          request_method: POST
          tags:
            - tag: component
              value: ethernet
            - tag: component
              value: interface
            - tag: component
              value: json
        - uuid: b127e666416c41eb9b40ec8a6c8d1364
          name: 'Mikrotik: REST API interface ethernet sfp'
          type: HTTP_AGENT
          key: interface.ethernet.sfp
          delay: 15m
          value_type: TEXT
          authtype: BASIC
          username: '{$REST_API_USER}'
          password: '{$REST_API_PASSWORD}'
          url: '{$REST_API_PROTOCOL}://{$REST_API_HOST}:{$REST_API_PORT}/rest/interface/ethernet/print'
          post_type: JSON
          posts: |
            {
                ".query":["running=true"],
                ".proplist" : ".id,default-name,name"
            }
          request_method: POST
          tags:
            - tag: component
              value: ethernet
            - tag: component
              value: interface
            - tag: component
              value: json
            - tag: component
              value: sfp
        - uuid: fa4675d5db1d4717a42b52e0b679c4c8
          name: 'Mikrotik: REST API ip firewall connection tracking'
          type: HTTP_AGENT
          key: ip.firewall.connection.tracking
          value_type: TEXT
          authtype: BASIC
          username: '{$REST_API_USER}'
          password: '{$REST_API_PASSWORD}'
          url: '{$REST_API_PROTOCOL}://{$REST_API_HOST}:{$REST_API_PORT}/rest/ip/firewall/connection/tracking/print'
          post_type: JSON
          posts: |
            {
                ".proplist" : "max-entries,total-entries,total-ip4-entries,total-ip6-entries"
            }
          request_method: POST
          tags:
            - tag: component
              value: json
        - uuid: 6f77c8c878604bed803a6fda85af80b0
          name: 'Mikrotik: REST API ip firewall connection tracking max-entries'
          type: DEPENDENT
          key: ip.firewall.connection.tracking.max-entries
          trends: '0'
          units: ents
          preprocessing:
            - type: JSONPATH
              parameters:
                - '$[0].["max-entries"]'
          master_item:
            key: ip.firewall.connection.tracking
          tags:
            - tag: component
              value: firewall
        - uuid: 6fa03008629149c68e1800979d46b278
          name: 'Mikrotik: REST API ip firewall connection tracking total-entries'
          type: DEPENDENT
          key: ip.firewall.connection.tracking.total-entries
          trends: '0'
          units: ents
          preprocessing:
            - type: JSONPATH
              parameters:
                - '$[0].["total-entries"]'
          master_item:
            key: ip.firewall.connection.tracking
          tags:
            - tag: component
              value: firewall
        - uuid: 246eb59d74dd40a4a54964802f8f380d
          name: 'Mikrotik: REST API ip firewall connection tracking total-ip4-entries'
          type: DEPENDENT
          key: ip.firewall.connection.tracking.total-ip4-entries
          trends: '0'
          units: ents
          preprocessing:
            - type: JSONPATH
              parameters:
                - '$[0].["total-ip4-entries"]'
          master_item:
            key: ip.firewall.connection.tracking
          tags:
            - tag: component
              value: firewall
        - uuid: 4b161115315c429ab8af78d0619692e8
          name: 'Mikrotik: REST API ip firewall connection tracking total-ip6-entries'
          type: DEPENDENT
          key: ip.firewall.connection.tracking.total-ip6-entries
          trends: '0'
          units: ents
          preprocessing:
            - type: JSONPATH
              parameters:
                - '$[0].["total-ip6-entries"]'
          master_item:
            key: ip.firewall.connection.tracking
          tags:
            - tag: component
              value: firewall
        - uuid: 462964448e8043858cc42cdbf02c8556
          name: 'Log trapper'
          type: TRAP
          key: log.trapper
          value_type: TEXT
          triggers:
            - uuid: f2572a1dee3e4b5498205c57c65b8641
              expression: 'length(last(/Mikrotik by REST API/log.trapper,#1))>0 and find(/Mikrotik by REST API/log.trapper,1,"regexp","\"topics\":\"[^\"]*error[^\"]*\"")=1'
              recovery_mode: NONE
              name: 'Log event'
              event_name: '{?jsonpath(last(//log.trapper,#1),"$.topics")}: {?jsonpath(last(//log.trapper,#1),"$.message")}'
              opdata: '{ITEM.VALUE}'
              priority: HIGH
              type: MULTIPLE
              manual_close: 'YES'
              tags:
                - tag: component
                  value: log
                - tag: topics
                  value: error
            - uuid: 24dd54e8560440868c1b3ecbcc5b6d18
              expression: 'length(last(/Mikrotik by REST API/log.trapper,#1))>0 and find(/Mikrotik by REST API/log.trapper,1,"regexp","\"topics\":\"[^\"]*info[^\"]*\"")=1'
              recovery_mode: NONE
              name: 'Log event'
              event_name: '{?jsonpath(last(//log.trapper,#1),"$.topics")}: {?jsonpath(last(//log.trapper,#1),"$.message")}'
              opdata: '{ITEM.VALUE}'
              priority: INFO
              type: MULTIPLE
              manual_close: 'YES'
              tags:
                - tag: component
                  value: log
                - tag: topics
                  value: info
            - uuid: 7aeb27bf9e7a466f962e66cfc4764e65
              expression: 'length(last(/Mikrotik by REST API/log.trapper,#1))>0 and find(/Mikrotik by REST API/log.trapper,1,"regexp","\"topics\":\"[^\"]*warning[^\"]*\"")=1'
              recovery_mode: NONE
              name: 'Log event'
              event_name: '{?jsonpath(last(//log.trapper,#1),"$.topics")}: {?jsonpath(last(//log.trapper,#1),"$.message")}'
              opdata: '{ITEM.VALUE}'
              priority: WARNING
              type: MULTIPLE
              manual_close: 'YES'
              tags:
                - tag: component
                  value: log
                - tag: topics
                  value: warning
        - uuid: b90273167fa5468792f1db66e387c427
          name: 'Mikrotik: REST API system health.'
          type: HTTP_AGENT
          key: system.health
          value_type: TEXT
          authtype: BASIC
          username: '{$REST_API_USER}'
          password: '{$REST_API_PASSWORD}'
          url: '{$REST_API_PROTOCOL}://{$REST_API_HOST}:{$REST_API_PORT}/rest/system/health'
          tags:
            - tag: component
              value: json
        - uuid: 769b39a17f9c440cb83566b9f77f2f3d
          name: 'Mikrotik: REST API system identity.'
          type: HTTP_AGENT
          key: system.identity
          delay: 15m
          value_type: TEXT
          authtype: BASIC
          username: '{$REST_API_USER}'
          password: '{$REST_API_PASSWORD}'
          inventory_link: NAME
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.name
          url: '{$REST_API_PROTOCOL}://{$REST_API_HOST}:{$REST_API_PORT}/rest/system/identity'
          tags:
            - tag: component
              value: json
        - uuid: 671e9418a8fe4284888f1cb49d345747
          name: 'Mikrotik: Operating system'
          type: CALCULATED
          key: system.os
          delay: 15m
          value_type: TEXT
          params: 'concat(last(//system.resource.platform), " RouterOS ", last(//system.resource.version), " ", last(//system.resource.board-name), ".")'
          inventory_link: OS
          tags:
            - tag: component
              value: os
        - uuid: f16f475e095d4ee4bb32e7aa6bc67716
          name: 'Mikrotik: REST API system resource.'
          type: HTTP_AGENT
          key: system.resource
          value_type: TEXT
          authtype: BASIC
          username: '{$REST_API_USER}'
          password: '{$REST_API_PASSWORD}'
          url: '{$REST_API_PROTOCOL}://{$REST_API_HOST}:{$REST_API_PORT}/rest/system/resource'
          tags:
            - tag: component
              value: json
        - uuid: e9ab27bb9e444ff0a944f5c4b419747c
          name: 'Mikrotik: System resouce architecture-name.'
          type: DEPENDENT
          key: system.resource.architecture-name
          value_type: TEXT
          inventory_link: HW_ARCH
          preprocessing:
            - type: JSONPATH
              parameters:
                - '$.["architecture-name"]'
          master_item:
            key: system.resource
        - uuid: d4d147bf2d844c9a9536da65f4aa9eaf
          name: 'Mikrotik: System resource board-name.'
          type: DEPENDENT
          key: system.resource.board-name
          value_type: TEXT
          preprocessing:
            - type: JSONPATH
              parameters:
                - '$.["board-name"]'
          master_item:
            key: system.resource
        - uuid: ef2b0fe90ba643d199ea6d4c997eef65
          name: 'Mikrotik: REST API system resouce cpu.'
          type: HTTP_AGENT
          key: system.resource.cpu
          value_type: TEXT
          authtype: BASIC
          username: '{$REST_API_USER}'
          password: '{$REST_API_PASSWORD}'
          url: '{$REST_API_PROTOCOL}://{$REST_API_HOST}:{$REST_API_PORT}/rest/system/resource/cpu'
          tags:
            - tag: component
              value: json
        - uuid: 12f03188342f4b3c80787ae4345b8e53
          name: 'Mikrotik: System resource cpu-load.'
          type: DEPENDENT
          key: system.resource.cpu-load
          units: '%'
          preprocessing:
            - type: JSONPATH
              parameters:
                - '$.["cpu-load"]'
          master_item:
            key: system.resource
        - uuid: 23e0096387954ac69a72174b8309ae43
          name: 'Mikrotik: System resource free-hdd-space.'
          type: DEPENDENT
          key: system.resource.free-hdd-space
          units: B
          preprocessing:
            - type: JSONPATH
              parameters:
                - '$.["free-hdd-space"]'
          master_item:
            key: system.resource
        - uuid: 6681349b61ec46d9b5a0ebdb64d54600
          name: 'Mikrotik: System resource free-memory.'
          type: DEPENDENT
          key: system.resource.free-memory
          units: B
          preprocessing:
            - type: JSONPATH
              parameters:
                - '$.["free-memory"]'
          master_item:
            key: system.resource
        - uuid: a54d0563f30146c0b625226f916ad8c6
          name: 'Mikrotik: System resource hdd space utilization.'
          type: CALCULATED
          key: system.resource.hdd-space-utilization
          units: '%'
          params: '(last(//system.resource.total-hdd-space)-last(//system.resource.free-hdd-space))*100/last(//system.resource.total-hdd-space)'
        - uuid: 37c1634dda2b4722ad9b767c852c19c4
          name: 'Mikrotik: System resource memory utilization.'
          type: CALCULATED
          key: system.resource.memory-utilization
          units: '%'
          params: '(last(//system.resource.total-memory)-last(//system.resource.free-memory))*100/last(//system.resource.total-memory)'
        - uuid: 011193e39516492d8d8849a364ac2a6a
          name: 'Mikrotik: System resource platform.'
          type: DEPENDENT
          key: system.resource.platform
          value_type: TEXT
          inventory_link: VENDOR
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.platform
          master_item:
            key: system.resource
        - uuid: 0efd34703340497a821f0078e186da36
          name: 'Mikrotik: System resource total-hdd-space.'
          type: DEPENDENT
          key: system.resource.total-hdd-space
          units: B
          preprocessing:
            - type: JSONPATH
              parameters:
                - '$.["total-hdd-space"]'
          master_item:
            key: system.resource
        - uuid: 4a487e401ce14de9800a2c1ff3fe2128
          name: 'Mikrotik: System resource total-memory.'
          type: DEPENDENT
          key: system.resource.total-memory
          trends: '0'
          units: B
          preprocessing:
            - type: JSONPATH
              parameters:
                - '$.["total-memory"]'
          master_item:
            key: system.resource
        - uuid: d51ba84b565c44f99f7255a444560e0b
          name: 'Mikrotik: System resource uptime.'
          type: DEPENDENT
          key: system.resource.uptime
          value_type: TEXT
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.uptime
          master_item:
            key: system.resource
        - uuid: ee48b5d1ccaa4ac691aef688aa230a6e
          name: 'Mikrotik: System resource version.'
          type: DEPENDENT
          key: system.resource.version
          value_type: TEXT
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.version
          master_item:
            key: system.resource
        - uuid: 56cbb493a71a4b7cb0e842c9a59eafbb
          name: 'Mikrotik: REST API system routerboard.'
          type: HTTP_AGENT
          key: system.routerboard
          delay: 15m
          value_type: TEXT
          authtype: BASIC
          username: '{$REST_API_USER}'
          password: '{$REST_API_PASSWORD}'
          url: '{$REST_API_PROTOCOL}://{$REST_API_HOST}:{$REST_API_PORT}/rest/system/routerboard'
          tags:
            - tag: component
              value: json
        - uuid: 430ce1260c3a43688ad5ac7dc3f44f0a
          name: 'Mikrotik: System routerboard current-firmware.'
          type: DEPENDENT
          key: system.routerboard.current-firmware
          value_type: TEXT
          preprocessing:
            - type: JSONPATH
              parameters:
                - '$.["current-firmware"]'
          master_item:
            key: system.routerboard
        - uuid: 0d633d32eab140d188f672256b408454
          name: 'Mikrotik: System routerboard hardware.'
          type: CALCULATED
          key: system.routerboard.hardware
          delay: 15m
          value_type: TEXT
          params: 'concat(last(//system.resource.board-name), " (", last(//system.routerboard.model), ")")'
          inventory_link: HARDWARE
        - uuid: 2dfafd6984334fa9b9d15aa0e158d073
          name: 'Mikrotik: System routerboard model.'
          type: DEPENDENT
          key: system.routerboard.model
          value_type: TEXT
          inventory_link: MODEL
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.model
          master_item:
            key: system.routerboard
        - uuid: eb6cf7dfe6104ede9bcf63b108d7807b
          name: 'Mikrotik: System routerboard serial-number.'
          type: DEPENDENT
          key: system.routerboard.serial-number
          value_type: TEXT
          inventory_link: SERIALNO_A
          preprocessing:
            - type: JSONPATH
              parameters:
                - '$.["serial-number"]'
          master_item:
            key: system.routerboard
        - uuid: 755fa2ad93434170a3bda5d7404d5f22
          name: 'Mikrotik: System routerboard type.'
          type: DEPENDENT
          key: system.routerboard.type
          value_type: TEXT
          inventory_link: TYPE
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - |
                  var result;
                  
                  switch (true) {
                      case /^CCR/.test(value):
                          result = "Cloud Core Router";
                          break;
                      case /^CRS/.test(value):
                          result = "Cloud Router Switch";
                          break;
                      case /^RB/.test(value):
                          result = "Routerboard";
                          break;
                      case /hAP/.test(value):
                          result = "Home Router AP";
                          break;
                      default:
                          result = "undefined";
                  }
                  
                  return result;
          master_item:
            key: system.routerboard.hardware
        - uuid: ae5a594e83024d89934acbab41c9b255
          name: 'Mikrotik: System routerboard upgrade-firmware.'
          type: DEPENDENT
          key: system.routerboard.upgrade-firmware
          value_type: TEXT
          preprocessing:
            - type: JSONPATH
              parameters:
                - '$.["upgrade-firmware"]'
          master_item:
            key: system.routerboard
      discovery_rules:
        - uuid: 794c8c1b21a44e60afe486fbfdd4d54a
          name: 'Interface discovery'
          type: DEPENDENT
          key: interface.discovery
          filter:
            conditions:
              - macro: '{#RUNNING}'
                value: 'true'
          enabled_lifetime_type: DISABLE_AFTER
          enabled_lifetime: 1d
          item_prototypes:
            - uuid: 29a1f714e6e54b9ab5739db4bd7c53ea
              name: 'Interface {#IFNAME} running'
              type: DEPENDENT
              key: 'interface.[{#IFNAME}.running]'
              value_type: TEXT
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - '$.[?(@.[".id"] == "{#INDEX}")].["running"].first()'
                  error_handler: CUSTOM_VALUE
                  error_handler_params: 'false'
              master_item:
                key: interface
              trigger_prototypes:
                - uuid: 2723f273d56a4834ad7c8aec6400a0ed
                  expression: 'last(/Mikrotik by REST API/interface.[{#IFNAME}.running],#2)="true" and last(/Mikrotik by REST API/interface.[{#IFNAME}.running],#1)="false"'
                  recovery_mode: RECOVERY_EXPRESSION
                  recovery_expression: 'last(/Mikrotik by REST API/interface.[{#IFNAME}.running],#1)="true"'
                  name: 'Interface {#IFNAME} running'
                  priority: WARNING
                  manual_close: 'YES'
            - uuid: a7c940beac5f417fbe6454965136242e
              name: 'Interface {#IFNAME} rx-byte'
              type: DEPENDENT
              key: 'interface.[{#IFNAME}.rx-byte]'
              trends: '0'
              units: bps
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - '$.[?(@.[".id"] == "{#INDEX}")].["rx-byte"].first()'
                - type: CHANGE_PER_SECOND
                - type: MULTIPLIER
                  parameters:
                    - '8'
              master_item:
                key: interface
            - uuid: 90e2191d89254337bd4f6b87cf0ae222
              name: 'Interface {#IFNAME} tx-byte'
              type: DEPENDENT
              key: 'interface.[{#IFNAME}.tx-byte]'
              trends: '0'
              units: bps
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - '$.[?(@.[".id"] == "{#INDEX}")].["tx-byte"].first()'
                - type: CHANGE_PER_SECOND
                - type: MULTIPLIER
                  parameters:
                    - '8'
              master_item:
                key: interface
          graph_prototypes:
            - uuid: aaf2492f17c64d628523898db0f5a883
              name: 'Interface {#IFNAME} network traffic'
              graph_items:
                - color: 1A7C11
                  calc_fnc: ALL
                  item:
                    host: 'Mikrotik by REST API'
                    key: 'interface.[{#IFNAME}.rx-byte]'
                - sortorder: '1'
                  color: FF4000
                  calc_fnc: ALL
                  item:
                    host: 'Mikrotik by REST API'
                    key: 'interface.[{#IFNAME}.tx-byte]'
          master_item:
            key: interface
          lld_macro_paths:
            - lld_macro: '{#IFNAME}'
              path: $.name
            - lld_macro: '{#IFTYPE}'
              path: $.type
            - lld_macro: '{#INDEX}'
              path: '$.[".id"]'
            - lld_macro: '{#RUNNING}'
              path: $.running
        - uuid: 9e294d1dbd0243708489c28874041d61
          name: 'Interface ethernet discovery'
          type: DEPENDENT
          key: interface.ethernet.discovery
          item_prototypes:
            - uuid: d16df08303ce4b99af1bacfe351dfe3d
              name: 'Interface ethernet {#IFNAME} driver-rx-byte'
              type: DEPENDENT
              key: 'interface.ethernet.[{#IFNAME}.driver-rx-byte]'
              trends: '0'
              units: B
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - '$.[?(@.[".id"] == "{#INDEX}")].["driver-rx-byte"].first()'
              master_item:
                key: interface.ethernet
            - uuid: 89ae3b3367fd4c9ab56596e66ec2bdc7
              name: 'Interface ethernet {#IFNAME} driver-rx-packet'
              type: DEPENDENT
              key: 'interface.ethernet.[{#IFNAME}.driver-rx-packet]'
              trends: '0'
              units: pkt
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - '$.[?(@.[".id"] == "{#INDEX}")].["driver-rx-packet"].first()'
              master_item:
                key: interface.ethernet
            - uuid: 1fff2bce9fef4c9090a339c9bc4d0288
              name: 'Interface ethernet {#IFNAME} driver-tx-byte'
              type: DEPENDENT
              key: 'interface.ethernet.[{#IFNAME}.driver-tx-byte]'
              trends: '0'
              units: B
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - '$.[?(@.[".id"] == "{#INDEX}")].["driver-tx-byte"].first()'
              master_item:
                key: interface.ethernet
            - uuid: eb907f04ee1644929a760f68b492759d
              name: 'Interface ethernet {#IFNAME} driver-tx-packet'
              type: DEPENDENT
              key: 'interface.ethernet.[{#IFNAME}.driver-tx-packet]'
              trends: '0'
              units: pkt
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - '$.[?(@.[".id"] == "{#INDEX}")].["driver-tx-packet"].first()'
              master_item:
                key: interface.ethernet
            - uuid: 6b915db1a6a040daab8ceec9ca8ff5b2
              name: 'Interface ethernet {#IFNAME} rx-broadcast'
              type: DEPENDENT
              key: 'interface.ethernet.[{#IFNAME}.rx-broadcast]'
              trends: '0'
              units: pkt
              preprocessing:
                - type: JSONPATH
                  parameters:
